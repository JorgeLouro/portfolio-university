<header>
    <img src="https://www.ulusiada.pt/img/logoul_.png" alt="Logo UL" class="logo">
        <h1>Frequencia de CRG</h1>
</header>
<body>
    <div class="form-container">
        <form action="/submit-your-form-handler" method="POST">
            <label for="name">Nome:* </label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:* </label>
            <input type="email" id="email" name="email" required>

            <label for="phone">Telefone: </label>
            <input type="tel" id="phone" name="phone">

            <p>Como prefere ser contactado?</p>
            <label><input type="radio" name="contact" value="sms"> SMS</label>
            <label><input type="radio" name="contact" value="email"> E-mail</label>
            <label><input type="radio" name="contact" value="whatsapp"> WhatsApp</label>

            <button type="submit">Enviar</button>
        </form>
    </div>
