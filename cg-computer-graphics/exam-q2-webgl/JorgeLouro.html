<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebGL Círculo Interativo</title>
    <script id="vertex-shader" type="x-shader/x-vertex">
        attribute vec4 vPosition;
        attribute vec4 vColor;
        varying vec4 fColor;

        void main() {
            gl_Position = vPosition;
            fColor = vColor;
        }
    </script>

    <script id="fragment-shader" type="x-shader/x-fragment">
        precision mediump float;
        varying vec4 fColor;
        void main() {
            gl_FragColor = fColor;
        }
    </script>
</head>
<body>
    <canvas id="gl-canvas" width="500" height="500"></canvas>
    <br>
    Cor: <input type="range" id="sliderCor" min="0" max="1" step="0.01" value="0.5">
    <script type="text/javascript" src="webgl-utils.js"></script>
    <script type="text/javascript" src="initShaders.js"></script>
    <script type="text/javascript" src="MV.js"></script>
    <script type="text/javascript" src="2_Teste_Questao2.js"></script>
</body>
</html>
